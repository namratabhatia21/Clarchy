name: Pages

# Publishes the site (cloudarchie export-site) to GitHub Pages, with AWS prices refreshed
# from the AWS Price List API on every deploy and every Monday.
# Requires Settings → Pages → Source: "GitHub Actions". The custom domain (clarchy.com) is
# set in Settings → Pages too; workflow deployments ignore a CNAME file.

on:
  push:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Deploy only from the default branch, whichever it is.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh AWS prices from the AWS Price List API
        run: |
          pip install pyyaml
          PYTHONPATH=src python -m cloudarchie.aws_prices --output src/cloudarchie/data/prices/aws.yaml \
            || echo "::warning::Could not refresh AWS prices; publishing the committed price book"
      - run: pip install .
      - run: cloudarchie export-site -o site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
