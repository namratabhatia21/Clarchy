name: Pages

# Publishes the site (clarchy export-site) to GitHub Pages and, when the repository has
# Cloudflare secrets, to the Cloudflare Worker "clarchy" (static assets, wrangler.jsonc).
# AWS prices are refreshed from the AWS Price List API on every deploy and every Monday.
#
# Cloudflare: add the secrets CLOUDFLARE_API_TOKEN (permission "Workers Scripts: Edit")
# and CLOUDFLARE_ACCOUNT_ID.
# To stop publishing to GitHub Pages, set the repository variable GITHUB_PAGES to "off".
# Requires Settings → Pages → Source: "GitHub Actions". The custom domain (clarchy.com) is
# set in Settings → Pages too; workflow deployments ignore a CNAME file.

on:
  push:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Deploy only from the default branch, whichever it is.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh AWS prices from the AWS Price List API
        run: |
          pip install pyyaml
          PYTHONPATH=src python -m clarchy.aws_prices --output src/clarchy/data/prices/aws.yaml \
            || echo "::warning::Could not refresh AWS prices; publishing the committed price book"
      - run: pip install .
      - run: clarchy export-site -o site
      - name: Deploy to Cloudflare (Worker "clarchy")
        if: env.HAS_CLOUDFLARE == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - uses: actions/configure-pages@v5
        if: vars.GITHUB_PAGES != 'off'
      - uses: actions/upload-pages-artifact@v3
        if: vars.GITHUB_PAGES != 'off'
        with:
          path: site

  deploy:
    needs: build
    if: vars.GITHUB_PAGES != 'off'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
