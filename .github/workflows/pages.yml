name: Pages

# Publishes the site (clarchy export-site) to GitHub Pages and, when the repository has
# Cloudflare secrets, to the Cloudflare Worker "clarchy" (wrangler.jsonc). Prices come
# from the committed price books, which the Prices workflow (prices.yml) refreshes every day.
#
# Cloudflare: Workers Builds (the Worker connected to this repository, build command
# "make prices site") deploys every push, including the daily price commits. This workflow
# deploys to Cloudflare only on manual runs, as a fallback. That needs the secrets
# CLOUDFLARE_API_TOKEN (permission "Workers Scripts: Edit") and CLOUDFLARE_ACCOUNT_ID.
# GitHub Pages is optional: the copy there is published only when Settings → Pages → Source
# is "GitHub Actions" (private repositories need a paid GitHub plan for Pages). When Pages
# is off, those steps are skipped and the run still passes. To skip them on purpose, set
# the repository variable GITHUB_PAGES to "off".

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Deploy only from the default branch, whichever it is.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outcome == 'success' }}
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the site
        run: make prices site
      - name: Deploy to Cloudflare (Worker "clarchy")
        # Pushes are deployed by Workers Builds; this is for manual runs.
        if: env.HAS_CLOUDFLARE == 'true' && github.event_name == 'workflow_dispatch'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The action's default (wrangler 3.90) can't read wrangler.jsonc.
          wranglerVersion: "4.147.0"
          command: deploy
      - name: Check that GitHub Pages is turned on
        id: pages
        if: vars.GITHUB_PAGES != 'off'
        # Answers "Not Found" when Pages is off; that only skips the GitHub Pages copy.
        continue-on-error: true
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
