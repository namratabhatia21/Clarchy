name: Release

# Publishes a GitHub release when a version tag is pushed from main:
#
#   git tag -a v0.1.0 -m "Clarchy 0.1.0" && git push origin v0.1.0
#
# It checks that the tag matches the version in pyproject.toml, runs the checks, builds
# the package (wheel and source) and a ready-to-host copy of the site, and creates the
# release with that version's notes from CHANGELOG.md. CONTRIBUTING.md has the steps.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but pyproject.toml says $version."
            exit 1
          fi
      - name: Lint and test
        run: |
          pip install -q -e ".[dev]"
          ruff check .
          ruff format --check .
          pytest -q
      - name: Build the package and the site
        run: |
          pip install -q build
          python -m build
          clarchy export-site -o site
          (cd site && zip -qr "../dist/clarchy-site-$GITHUB_REF_NAME.zip" .)
          ls -l dist
      - name: Write the release notes
        run: python scripts/release_notes.py "$GITHUB_REF_NAME" > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --title "Clarchy $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
