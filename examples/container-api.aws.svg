<g class="ca-step" data-step="1"><circle cx="33" cy="1128" r="9"/><text x="33" y="1131.8" text-anchor="middle">1</text></g>
<text class="ca-steps-text" x="50" y="1132">Clients → Domain: look up the app's address</text>
<g class="ca-step" data-step="2"><circle cx="33" cy="1152" r="9"/><text x="33" y="1155.8" text-anchor="middle">2</text></g>
<text class="ca-steps-text" x="50" y="1156">Clients → Web firewall: filter malicious traffic (HTTPS)</text>
<g class="ca-step" data-step="3"><circle cx="33" cy="1176" r="9"/><text x="33" y="1179.8" text-anchor="middle">3</text></g>
<text class="ca-steps-text" x="50" y="1180">Web firewall → HTTPS load balancer: spread requests across healthy instances</text>
<g class="ca-step" data-step="4"><circle cx="33" cy="1200" r="9"/><text x="33" y="1203.8" text-anchor="middle">4</text></g>
<text class="ca-steps-text" x="50" y="1204">HTTPS load balancer → API containers: run the business logic</text>
<g class="ca-step" data-step="5"><circle cx="33" cy="1224" r="9"/><text x="33" y="1227.8" text-anchor="middle">5</text></g>
<text class="ca-steps-text" x="50" y="1228">API containers → Session + query cache: read and refresh cached results</text>
<g class="ca-step" data-step="6"><circle cx="769" cy="1128" r="9"/><text x="769" y="1131.8" text-anchor="middle">6</text></g>
<text class="ca-steps-text" x="786" y="1132">API containers → PostgreSQL: read and write records</text>
<g class="ca-step" data-step="7"><circle cx="769" cy="1152" r="9"/><text x="769" y="1155.8" text-anchor="middle">7</text></g>
<text class="ca-steps-text" x="786" y="1156">API containers → Uploads: store or read files</text>
<g class="ca-step" data-step="8"><circle cx="769" cy="1176" r="9"/><text x="769" y="1179.8" text-anchor="middle">8</text></g>
<text class="ca-steps-text" x="786" y="1180">API containers → DB credentials: fetch credentials</text>
<g class="ca-step" data-step="9"><circle cx="769" cy="1200" r="9"/><text x="769" y="1203.8" text-anchor="middle">9</text></g>
<text class="ca-steps-text" x="786" y="1204">Every component → Logs, metrics, alarms: send logs and metrics</text>
