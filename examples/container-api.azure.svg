<text class="ca-steps-text" x="50" y="1116">Web firewall → HTTPS load balancer: spread requests across healthy instances</text>
<g class="ca-step" data-step="4"><circle cx="33" cy="1136" r="9"/><text x="33" y="1139.8" text-anchor="middle">4</text></g>
<text class="ca-steps-text" x="50" y="1140">HTTPS load balancer → API containers: run the business logic</text>
<g class="ca-step" data-step="5"><circle cx="33" cy="1160" r="9"/><text x="33" y="1163.8" text-anchor="middle">5</text></g>
<text class="ca-steps-text" x="50" y="1164">API containers → Session + query cache: read and refresh cached results</text>
<g class="ca-step" data-step="6"><circle cx="747" cy="1064" r="9"/><text x="747" y="1067.8" text-anchor="middle">6</text></g>
<text class="ca-steps-text" x="764" y="1068">API containers → PostgreSQL: read and write records</text>
<g class="ca-step" data-step="7"><circle cx="747" cy="1088" r="9"/><text x="747" y="1091.8" text-anchor="middle">7</text></g>
<text class="ca-steps-text" x="764" y="1092">API containers → Uploads: store or read files</text>
<g class="ca-step" data-step="8"><circle cx="747" cy="1112" r="9"/><text x="747" y="1115.8" text-anchor="middle">8</text></g>
<text class="ca-steps-text" x="764" y="1116">API containers → DB credentials: fetch credentials</text>
<g class="ca-step" data-step="9"><circle cx="747" cy="1136" r="9"/><text x="747" y="1139.8" text-anchor="middle">9</text></g>
<text class="ca-steps-text" x="764" y="1140">Every component → Logs, metrics, alarms: send logs and metrics</text>
