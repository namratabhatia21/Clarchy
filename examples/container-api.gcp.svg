<text class="ca-steps-text" x="1141" y="838">API containers → PostgreSQL: read and write records</text>
<g class="ca-step" data-step="7"><circle cx="1124" cy="858" r="9"/><text x="1124" y="861.8" text-anchor="middle">7</text></g>
<text class="ca-steps-text" x="1141" y="862">API containers → Uploads: store or read files</text>
<g class="ca-step" data-step="8"><circle cx="1124" cy="882" r="9"/><text x="1124" y="885.8" text-anchor="middle">8</text></g>
<text class="ca-steps-text" x="1141" y="886">API containers → DB credentials: fetch credentials</text>
<g class="ca-step" data-step="9"><circle cx="1124" cy="906" r="9"/><text x="1124" y="909.8" text-anchor="middle">9</text></g>
<text class="ca-steps-text" x="1141" y="910">Every component → Logs, metrics, alarms: send logs and metrics</text>
