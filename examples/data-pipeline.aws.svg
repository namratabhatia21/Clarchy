<rect class="ca-bg" width="1136" height="830"/>
<text class="ca-title" x="24" y="36">Analytics data pipeline · AWS</text>
<text class="ca-subtitle" x="24" y="56">Streams application events into a data lake, transforms them on a schedule and serves dashboards from a warehouse.</text>
