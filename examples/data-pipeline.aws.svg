<svg xmlns="http://www.w3.org/2000/svg" class="ca-diagram ca-aws" width="1136" height="830" viewBox="0 0 1136 830" role="img" aria-label="Analytics data pipeline on AWS">
<style>.ca-aws{font-family:'Open Sans', 'Helvetica Neue', Arial, sans-serif}
