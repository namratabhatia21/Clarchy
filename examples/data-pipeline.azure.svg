.edge-label{font:11px sans-serif;fill:#16191f;paint-order:stroke;stroke:#ffffff;stroke-width:4}
.footer{font:10px sans-serif;fill:#879196}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#545b64"/></marker></defs>
<rect class="bg" width="932" height="644"/>
<text class="title" x="24" y="36">Analytics data pipeline · Azure</text>
<text class="subtitle" x="24" y="56">Streams application events into a data lake, transforms them on a schedule and serves dashboards from a warehouse.</text>
