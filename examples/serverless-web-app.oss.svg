<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="644" viewBox="0 0 1160 644" role="img" aria-label="Serverless web app on Open source">
<style>.bg{fill:#ffffff}
.title{font:600 18px sans-serif;fill:#16191f}
.subtitle{font:13px sans-serif;fill:#545b64}
.cloud{fill:#f8f9fa;stroke:#232f3e;stroke-width:1.5}
.cloud-label{font:600 13px sans-serif;fill:#232f3e}
.band{fill:none;stroke:#aab7b8;stroke-dasharray:5 4}
.band-label{font:600 12px sans-serif;fill:#545b64}
.node-box{fill:#ffffff;stroke-width:1.5}
.badge{font:700 14px sans-serif;fill:#ffffff}
.service{font:600 12px sans-serif;fill:#16191f}
.label{font:11px sans-serif;fill:#545b64}
.fidelity{font:italic 10px sans-serif;fill:#b0084d}
.edge{fill:none;stroke:#545b64;stroke-width:1.5}
.edge-label{font:11px sans-serif;fill:#16191f;paint-order:stroke;stroke:#ffffff;stroke-width:4}
.footer{font:10px sans-serif;fill:#879196}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#545b64"/></marker></defs>
<rect class="bg" width="1160" height="644"/>
<text class="title" x="24" y="36">Serverless web app · Open source</text>
<text class="subtitle" x="24" y="56">Single-page app with a serverless API, for spiky or low traffic where paying per request beats paying for idle servers.</text>
<rect class="cloud" x="252" y="104" width="884" height="488" rx="4"/>
<text class="cloud-label" x="262" y="123">Self-hosted (open source) · US East</text>
<rect class="band" x="262" y="420" width="864" height="162" rx="4"/>
<text class="band-label" x="272" y="440">Shared services</text>
