[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "clarchy"
version = "0.1.0"
description = "Turns a requirements brief into a cloud architecture, priced and drawn for AWS, Azure, Google Cloud and open source"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Namrata Bhatia"}]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
agent = ["anthropic>=1.0,<2", "mcp>=1.20,<2"]
ingest = ["pypdf>=4"]
all = ["clarchy[web,agent,ingest]"]
dev = [
    "clarchy[web,agent,ingest]",
    "pytest>=8",
    "ruff>=0.15,<0.17",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://clarchy.com"
Source = "https://github.com/namratabhatia21/Clarchy"

[project.scripts]
clarchy = "clarchy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clarchy = [
    "data/*.yaml",
    "data/mappings/*.yaml",
    "data/patterns/*.yaml",
    "data/prices/*.yaml",
    "data/directory/*.yaml",
    "data/samples/*.md",
    "data/blog/*.md",
    "data/icons/*/*.svg",
    "data/icons/*/*.png",
    "data/icons/*/*.md",
    "static/*",
    "static/fonts/*",
    "static/brand/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
