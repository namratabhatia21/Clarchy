# Capability -> AWS service.
#
# fidelity: how well the service matches the neutral capability
#   exact   - same concept, comparable features
#   close   - same job, notable differences (see note)
#   partial - covers part of the capability; something else is needed for the rest
# short: 2-4 letter badge used when no icon is found.
# icon: filename stem of the service's AWS Architecture Icon (Arch_<stem>_64.svg), matched
#   case-insensitively. The icons for these stems ship in data/icons/aws/ (ADR 0012); a
#   newer AWS package passed with --icons is searched the same way.

provider:
  name: AWS
  cloud_label: AWS Cloud
  kind: cloud
  # Set to true once an AWS specialist has reviewed every entry.
  reviewed: false
  # Diagram styling that follows AWS architecture-diagram conventions: a dark
  # "AWS Cloud" boundary and AWS's colour per service category. Colours only, no logos.
  theme:
    font: "'Open Sans', 'Helvetica Neue', Arial, sans-serif"
    frame: { stroke: "#232F3E", fill: "#FFFFFF", label: "#232F3E", dash: "" }
    band: { stroke: "#879196", label: "#545B64" }
    edge: "#545B64"
    categories:
      external: "#545B64"
      networking: "#8C4FFF"
      security: "#DD344C"
      compute: "#ED7100"
      containers: "#ED7100"
      ai: "#01A88D"
      integration: "#E7157B"
      analytics: "#8C4FFF"
      database: "#C925D1"
      storage: "#7AA116"
      devtools: "#3B48CC"
      management: "#E7157B"

services:
  dns:
    service: Amazon Route 53
    short: R53
    fidelity: exact
    alternatives: [Cloudflare DNS]
    icon: Amazon-Route-53
    docs: https://docs.aws.amazon.com/route53/
  cdn:
    service: Amazon CloudFront
    short: CF
    fidelity: exact
    alternatives: [Cloudflare]
    icon: Amazon-CloudFront
    docs: https://docs.aws.amazon.com/cloudfront/
  waf:
    service: AWS WAF
    short: WAF
    fidelity: exact
    alternatives: [Cloudflare WAF]
    icon: AWS-WAF
    docs: https://docs.aws.amazon.com/waf/
  load-balancer:
    service: Application Load Balancer
    short: ALB
    fidelity: exact
    icon: Elastic-Load-Balancing
    docs: https://docs.aws.amazon.com/elasticloadbalancing/
  api-gateway:
    service: Amazon API Gateway
    short: APIG
    fidelity: exact
    icon: Amazon-API-Gateway
    docs: https://docs.aws.amazon.com/apigateway/
  container-service:
    service: Amazon ECS on AWS Fargate
    short: ECS
    fidelity: exact
    icon: AWS-Fargate
    alternatives: [Amazon EKS, AWS App Runner]
    docs: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/AWS_Fargate.html
  serverless-function:
    service: AWS Lambda
    short: λ
    fidelity: exact
    icon: AWS-Lambda
    docs: https://docs.aws.amazon.com/lambda/
  llm-inference:
    service: Amazon Bedrock
    short: BR
    fidelity: exact
    alternatives: [OpenAI API, Anthropic API (Claude), Hugging Face Inference Endpoints]
    icon: Amazon-Bedrock
    docs: https://docs.aws.amazon.com/bedrock/
  agent-orchestration:
    service: Amazon Bedrock AgentCore Runtime
    short: ACR
    fidelity: close
    icon: Amazon-Bedrock-AgentCore
    alternatives: [LangGraph on Amazon ECS, Amazon Bedrock Agents]
    note: Hosts agents built with LangGraph, CrewAI or Strands in isolated sessions, billed for active CPU and memory; AgentCore Memory, Gateway and Identity are separate add-ons.
    docs: https://docs.aws.amazon.com/bedrock-agentcore/
  llm-gateway:
    service: LiteLLM on Amazon ECS (AWS gateway guidance)
    short: GW
    fidelity: close
    icon: Amazon-Elastic-Container-Service
    alternatives: [Amazon Bedrock inference profiles, Amazon API Gateway]
    note: AWS has no managed LLM gateway; its multi-provider generative AI gateway guidance runs LiteLLM on ECS. Bedrock on its own gives one API across Bedrock models only.
    docs: https://aws.amazon.com/solutions/guidance/multi-provider-generative-ai-gateway-on-aws/
  llm-observability:
    service: Amazon CloudWatch generative AI observability
    short: GAO
    fidelity: close
    icon: Amazon-CloudWatch
    alternatives: [Langfuse on AWS, Bedrock model invocation logging]
    note: OpenTelemetry traces of agent steps, model calls, tokens and latency; prompt versions and evaluation datasets need AgentCore Evaluations or Langfuse.
    docs: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/
  message-queue:
    service: Amazon SQS
    short: SQS
    fidelity: exact
    icon: Amazon-Simple-Queue-Service
    docs: https://docs.aws.amazon.com/sqs/
  event-bus:
    service: Amazon EventBridge
    short: EB
    fidelity: exact
    icon: Amazon-EventBridge
    docs: https://docs.aws.amazon.com/eventbridge/
  stream:
    service: Amazon Kinesis Data Streams
    short: KDS
    fidelity: exact
    icon: Amazon-Kinesis-Data-Streams
    alternatives: [Amazon MSK]
    docs: https://docs.aws.amazon.com/streams/
  workflow:
    service: AWS Step Functions
    short: SFN
    fidelity: exact
    icon: AWS-Step-Functions
    docs: https://docs.aws.amazon.com/step-functions/
  batch-etl:
    service: AWS Glue
    short: GLU
    fidelity: exact
    icon: AWS-Glue
    docs: https://docs.aws.amazon.com/glue/
  object-storage:
    service: Amazon S3
    short: S3
    fidelity: exact
    icon: Amazon-Simple-Storage-Service
    docs: https://docs.aws.amazon.com/s3/
  relational-db:
    service: Amazon RDS for PostgreSQL
    short: RDS
    fidelity: exact
    icon: Amazon-RDS
    alternatives: [Amazon Aurora PostgreSQL]
    docs: https://docs.aws.amazon.com/rds/
  key-value-db:
    service: Amazon DynamoDB
    short: DDB
    fidelity: exact
    icon: Amazon-DynamoDB
    docs: https://docs.aws.amazon.com/dynamodb/
  cache:
    service: Amazon ElastiCache (Redis OSS / Valkey)
    short: EC
    fidelity: exact
    icon: Amazon-ElastiCache
    docs: https://docs.aws.amazon.com/elasticache/
  vector-search:
    service: Amazon OpenSearch Serverless (vector)
    short: AOS
    fidelity: close
    icon: Amazon-OpenSearch-Service
    alternatives: [Aurora PostgreSQL with pgvector, Amazon S3 Vectors]
    note: >-
      Vector search is one feature of a general search engine; a smaller workload may
      be cheaper on pgvector in the relational database.
    docs: https://docs.aws.amazon.com/opensearch-service/
  data-warehouse:
    service: Amazon Redshift Serverless
    short: RS
    fidelity: exact
    icon: Amazon-Redshift
    alternatives: [Amazon Athena on S3]
    docs: https://docs.aws.amazon.com/redshift/
  identity:
    service: Amazon Cognito
    short: COG
    fidelity: exact
    icon: Amazon-Cognito
    docs: https://docs.aws.amazon.com/cognito/
  secrets:
    service: AWS Secrets Manager
    short: SM
    fidelity: exact
    icon: AWS-Secrets-Manager
    docs: https://docs.aws.amazon.com/secretsmanager/
  monitoring:
    service: Amazon CloudWatch
    short: CW
    fidelity: exact
    icon: Amazon-CloudWatch
    docs: https://docs.aws.amazon.com/cloudwatch/
  kubernetes:
    service: Amazon EKS
    short: EKS
    fidelity: exact
    icon: Amazon-Elastic-Kubernetes-Service
    alternatives: [EKS Auto Mode]
    docs: https://docs.aws.amazon.com/eks/
  event-autoscaling:
    service: KEDA on Amazon EKS
    short: KEDA
    fidelity: close
    alternatives: [Application Auto Scaling (ECS)]
    note: >-
      KEDA is an open-source CNCF project you install on EKS. For ECS services,
      Application Auto Scaling with queue-based target tracking does a similar job.
    docs: https://keda.sh/docs/
  source-control:
    service: GitHub or GitLab via AWS CodeConnections
    short: GIT
    fidelity: partial
    alternatives: [AWS CodeCommit]
    note: >-
      Most teams host code on GitHub or GitLab and connect it to AWS pipelines with
      CodeConnections. Check AWS CodeCommit's current availability before choosing it.
    docs: https://docs.aws.amazon.com/dtconsole/latest/userguide/welcome-connections.html
  ci-build:
    service: AWS CodeBuild
    short: CB
    fidelity: exact
    icon: AWS-CodeBuild
    alternatives: [GitHub Actions]
    docs: https://docs.aws.amazon.com/codebuild/
  container-registry:
    service: Amazon ECR
    short: ECR
    fidelity: exact
    icon: Amazon-Elastic-Container-Registry
    docs: https://docs.aws.amazon.com/ecr/
  cd-deploy:
    service: AWS CodePipeline
    short: CP
    fidelity: exact
    icon: AWS-CodePipeline
    alternatives: [AWS CodeDeploy, GitHub Actions]
    docs: https://docs.aws.amazon.com/codepipeline/
  iac:
    service: AWS CloudFormation
    short: CFN
    fidelity: exact
    icon: AWS-CloudFormation
    alternatives: [AWS CDK, Terraform or OpenTofu]
    docs: https://docs.aws.amazon.com/cloudformation/
  dev-environment:
    service: GitHub Codespaces
    short: CS
    fidelity: close
    icon: Amazon-EC2
    alternatives: [Coder on Amazon EC2, Dev Containers]
    note: AWS no longer offers new Cloud9 environments; teams on AWS usually use GitHub Codespaces or run Coder on EC2. Billed by GitHub.
    docs: https://docs.github.com/codespaces
  ai-coding-assistant:
    service: Amazon Q Developer
    short: QD
    fidelity: exact
    icon: Amazon-Q
    alternatives: [GitHub Copilot, Claude Code, Cursor]
    note: Pro tier per developer; works in the IDE, the console and code reviews.
    docs: https://docs.aws.amazon.com/amazonq/latest/qdeveloper-ug/what-is.html
  ai-guardrails:
    service: Amazon Bedrock Guardrails
    short: GR
    fidelity: exact
    icon: Amazon-Bedrock
    alternatives: [NeMo Guardrails, Llama Guard]
    note: Content filters, prompt-attack detection, denied topics and PII masking; works with any model through the ApplyGuardrail API.
    docs: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails.html
  archive-storage:
    service: Amazon S3 Glacier Deep Archive
    short: GDA
    fidelity: exact
    icon: Amazon-Simple-Storage-Service-Glacier
    alternatives: [S3 Glacier Flexible Retrieval, S3 Glacier Instant Retrieval]
    note: Cheapest tier; restores take up to 12 hours, so keep anything read monthly in a warmer class. S3 lifecycle rules move objects automatically.
    docs: https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html
  access-governance:
    service: AWS IAM Identity Center + Organizations
    short: IAM
    fidelity: exact
    icon: AWS-IAM-Identity-Center
    alternatives: [IAM roles, Service control policies]
    note: Staff sign in with the company directory; permission sets per role; service control policies set limits for every account.
    docs: https://docs.aws.amazon.com/singlesignon/latest/userguide/what-is.html
  key-management:
    service: AWS KMS
    short: KMS
    fidelity: exact
    icon: AWS-Key-Management-Service
    alternatives: [AWS CloudHSM]
    docs: https://docs.aws.amazon.com/kms/latest/developerguide/overview.html
  audit-logging:
    service: AWS CloudTrail
    short: CT
    fidelity: exact
    icon: AWS-CloudTrail
    alternatives: [CloudTrail Lake]
    note: Management events of one trail are free; data events (object reads, function calls, model invocations) are billed per event.
    docs: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-user-guide.html
  backup:
    service: AWS Backup
    short: BAK
    fidelity: exact
    icon: AWS-Backup
    alternatives: [RDS automated backups]
    note: Central backup plans across databases and buckets, with cross-account or cross-Region copies and vault lock.
    docs: https://docs.aws.amazon.com/aws-backup/latest/devguide/whatisbackup.html
