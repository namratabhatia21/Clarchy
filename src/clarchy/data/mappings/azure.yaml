# Capability -> Microsoft Azure service. Same fields as aws.yaml.
# Not yet reviewed by an Azure specialist; the UI says so.

provider:
  name: Azure
  cloud_label: Microsoft Azure
  kind: cloud
  reviewed: false
  # Diagram styling that follows Azure architecture-diagram conventions: a blue
  # subscription boundary and Azure's blue-led palette. Colours only, no logos.
  theme:
    font: "'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    frame: { stroke: "#0078D4", fill: "#FFFFFF", label: "#0F548C", dash: "" }
    band: { stroke: "#8A8886", label: "#605E5C" }
    edge: "#605E5C"
    categories:
      external: "#605E5C"
      networking: "#0078D4"
      security: "#A4262C"
      compute: "#0063B1"
      containers: "#005B70"
      ai: "#6B2FBA"
      integration: "#8764B8"
      analytics: "#5C2D91"
      database: "#004E8C"
      storage: "#107C10"
      devtools: "#0F6CBD"
      management: "#486991"

services:
  dns:
    service: Azure DNS
    short: DNS
    fidelity: exact
    alternatives: [Cloudflare DNS]
    docs: https://learn.microsoft.com/azure/dns/
  cdn:
    service: Azure Front Door
    short: AFD
    fidelity: exact
    alternatives: [Cloudflare]
    note: Front Door combines CDN, global HTTP load balancing and an optional WAF in one service.
    docs: https://learn.microsoft.com/azure/frontdoor/
  waf:
    service: Azure Web Application Firewall
    short: WAF
    fidelity: exact
    alternatives: [Cloudflare WAF]
    note: Runs on Azure Front Door or Application Gateway rather than as a separate service.
    docs: https://learn.microsoft.com/azure/web-application-firewall/
  load-balancer:
    service: Azure Application Gateway
    short: AGW
    fidelity: exact
    docs: https://learn.microsoft.com/azure/application-gateway/
  api-gateway:
    service: Azure API Management
    short: APIM
    fidelity: exact
    docs: https://learn.microsoft.com/azure/api-management/
  container-service:
    service: Azure Container Apps
    short: ACA
    fidelity: exact
    alternatives: [Azure Kubernetes Service]
    docs: https://learn.microsoft.com/azure/container-apps/
  serverless-function:
    service: Azure Functions
    short: FN
    fidelity: exact
    docs: https://learn.microsoft.com/azure/azure-functions/
  llm-inference:
    service: Azure AI Foundry (incl. Azure OpenAI)
    short: AIF
    fidelity: exact
    alternatives: [OpenAI API, Anthropic API (Claude), Hugging Face Inference Endpoints]
    docs: https://learn.microsoft.com/azure/ai-foundry/
  agent-orchestration:
    service: Foundry Agent Service
    short: FAS
    fidelity: close
    alternatives: [LangGraph on Azure Container Apps, Semantic Kernel]
    note: Managed agents with threads, tools and evaluations in Microsoft Foundry; LangGraph agents can run as hosted agents or on Container Apps.
    docs: https://learn.microsoft.com/azure/ai-foundry/agents/overview
  llm-gateway:
    service: Azure API Management (AI gateway)
    short: AIG
    fidelity: close
    alternatives: [LiteLLM on Azure Container Apps]
    note: Gateway policies for Azure OpenAI and other models, such as token limits, load balancing across deployments, semantic caching and token metrics. Teams that also call non-Azure models often run LiteLLM instead.
    docs: https://learn.microsoft.com/azure/api-management/genai-gateway-capabilities
  llm-observability:
    service: Application Insights (Foundry tracing)
    short: TRC
    fidelity: close
    alternatives: [Langfuse on Azure]
    note: OpenTelemetry traces of agent runs and model calls, viewed in Foundry next to its evaluations.
    docs: https://learn.microsoft.com/azure/ai-foundry/how-to/develop/trace-application
  message-queue:
    service: Azure Service Bus (queues)
    short: SB
    fidelity: exact
    alternatives: [Azure Queue Storage]
    docs: https://learn.microsoft.com/azure/service-bus-messaging/
  event-bus:
    service: Azure Event Grid
    short: EG
    fidelity: exact
    docs: https://learn.microsoft.com/azure/event-grid/
  stream:
    service: Azure Event Hubs
    short: EH
    fidelity: exact
    docs: https://learn.microsoft.com/azure/event-hubs/
  workflow:
    service: Azure Logic Apps
    short: LA
    fidelity: close
    alternatives: [Durable Functions]
    note: Logic Apps is low-code; Durable Functions is the code-first option closer to writing Step Functions logic in code.
    docs: https://learn.microsoft.com/azure/logic-apps/
  batch-etl:
    service: Azure Data Factory
    short: ADF
    fidelity: close
    alternatives: [Azure Databricks, Microsoft Fabric]
    note: Data Factory orchestrates and moves data; heavy transformations usually run in Databricks or Fabric Spark.
    docs: https://learn.microsoft.com/azure/data-factory/
  object-storage:
    service: Azure Blob Storage
    short: BLOB
    fidelity: exact
    docs: https://learn.microsoft.com/azure/storage/blobs/
  relational-db:
    service: Azure Database for PostgreSQL (Flexible Server)
    short: PG
    fidelity: exact
    docs: https://learn.microsoft.com/azure/postgresql/flexible-server/
  key-value-db:
    service: Azure Cosmos DB
    short: CDB
    fidelity: exact
    alternatives: [Azure Table Storage]
    docs: https://learn.microsoft.com/azure/cosmos-db/
  cache:
    service: Azure Managed Redis
    short: RED
    fidelity: exact
    alternatives: [Azure Cache for Redis]
    docs: https://learn.microsoft.com/azure/redis/
  vector-search:
    service: Azure AI Search
    short: AIS
    fidelity: close
    alternatives: [Cosmos DB vector search, PostgreSQL with pgvector]
    note: Vector search is one feature of a full search service; small workloads may be cheaper in the database.
    docs: https://learn.microsoft.com/azure/search/
  data-warehouse:
    service: Microsoft Fabric Data Warehouse
    short: FAB
    fidelity: close
    alternatives: [Azure Synapse Analytics]
    note: Fabric is an analytics platform billed by reserved capacity, not per query or per compute-second.
    docs: https://learn.microsoft.com/fabric/data-warehouse/
  identity:
    service: Microsoft Entra External ID
    short: ENT
    fidelity: exact
    docs: https://learn.microsoft.com/entra/external-id/
  secrets:
    service: Azure Key Vault
    short: KV
    fidelity: exact
    docs: https://learn.microsoft.com/azure/key-vault/
  monitoring:
    service: Azure Monitor + Application Insights
    short: MON
    fidelity: exact
    docs: https://learn.microsoft.com/azure/azure-monitor/
  kubernetes:
    service: Azure Kubernetes Service (AKS)
    short: AKS
    fidelity: exact
    docs: https://learn.microsoft.com/azure/aks/
  event-autoscaling:
    service: KEDA add-on for AKS
    short: KEDA
    fidelity: exact
    note: Azure Container Apps also scales with KEDA rules built in.
    docs: https://learn.microsoft.com/azure/aks/keda-about
  source-control:
    service: Azure Repos
    short: REPO
    fidelity: exact
    alternatives: [GitHub]
    docs: https://learn.microsoft.com/azure/devops/repos/
  ci-build:
    service: Azure Pipelines
    short: PIPE
    fidelity: exact
    alternatives: [GitHub Actions]
    docs: https://learn.microsoft.com/azure/devops/pipelines/
  container-registry:
    service: Azure Container Registry
    short: ACR
    fidelity: exact
    docs: https://learn.microsoft.com/azure/container-registry/
  cd-deploy:
    service: Azure Pipelines (release stages)
    short: REL
    fidelity: exact
    alternatives: [GitHub Actions environments]
    note: The same Azure Pipelines definition usually builds and deploys.
    docs: https://learn.microsoft.com/azure/devops/pipelines/process/stages
  iac:
    service: Bicep
    short: BCP
    fidelity: exact
    alternatives: [ARM templates, Terraform or OpenTofu]
    docs: https://learn.microsoft.com/azure/azure-resource-manager/bicep/
  dev-environment:
    service: GitHub Codespaces
    short: CS
    fidelity: exact
    alternatives: [Microsoft Dev Box]
    note: GitHub is part of Microsoft; Dev Box gives full Windows workstations instead.
    docs: https://docs.github.com/codespaces
  ai-coding-assistant:
    service: GitHub Copilot
    short: GHC
    fidelity: exact
    alternatives: [Claude Code, Cursor]
    note: Business plan per developer, with IP indemnity and policy controls.
    docs: https://docs.github.com/copilot
  ai-guardrails:
    service: Azure AI Content Safety (Prompt Shields)
    short: ACS
    fidelity: exact
    alternatives: [NeMo Guardrails]
    note: Harm categories, prompt-injection shields and groundedness checks; Azure OpenAI deployments also apply default content filters.
    docs: https://learn.microsoft.com/azure/ai-services/content-safety/overview
  archive-storage:
    service: Azure Blob Storage (Archive tier)
    short: ARC
    fidelity: exact
    alternatives: [Blob Storage Cold tier]
    note: Rehydration takes hours; lifecycle management policies move blobs automatically.
    docs: https://learn.microsoft.com/azure/storage/blobs/access-tiers-overview
  access-governance:
    service: Microsoft Entra ID + Privileged Identity Management
    short: PIM
    fidelity: exact
    alternatives: [Azure Policy, Management groups]
    note: Just-in-time role activation with approval and access reviews need Entra ID P2 licences for the people who use them.
    docs: https://learn.microsoft.com/entra/id-governance/privileged-identity-management/pim-configure
  key-management:
    service: Azure Key Vault (keys)
    short: KV
    fidelity: exact
    alternatives: [Azure Managed HSM]
    docs: https://learn.microsoft.com/azure/key-vault/keys/about-keys
  audit-logging:
    service: Azure Monitor activity log + Log Analytics
    short: ACT
    fidelity: exact
    alternatives: [Microsoft Sentinel]
    note: The activity log is kept 90 days for free; longer retention goes to a Log Analytics workspace or storage.
    docs: https://learn.microsoft.com/azure/azure-monitor/essentials/activity-log
  backup:
    service: Azure Backup
    short: BAK
    fidelity: exact
    alternatives: [Database point-in-time restore]
    docs: https://learn.microsoft.com/azure/backup/backup-overview
