# Capability -> Google Cloud service. Same fields as aws.yaml.
# Not yet reviewed by a Google Cloud specialist; the UI says so.

provider:
  name: Google Cloud
  cloud_label: Google Cloud
  kind: cloud
  reviewed: false
  # Diagram styling that follows Google Cloud architecture-diagram conventions: a grey
  # project boundary and Google's four core colours. Colours only, no logos.
  theme:
    font: "Roboto, 'Helvetica Neue', Arial, sans-serif"
    frame: { stroke: "#5F6368", fill: "#F8F9FA", label: "#3C4043", dash: "" }
    band: { stroke: "#9AA0A6", label: "#5F6368" }
    edge: "#5F6368"
    categories:
      external: "#5F6368"
      networking: "#1A73E8"
      security: "#D93025"
      compute: "#1967D2"
      containers: "#185ABC"
      ai: "#9334E6"
      integration: "#C5221F"
      analytics: "#188038"
      database: "#1A73E8"
      storage: "#E37400"
      devtools: "#137333"
      management: "#B06000"

services:
  dns:
    service: Cloud DNS
    short: DNS
    fidelity: exact
    docs: https://cloud.google.com/dns/docs
  cdn:
    service: Cloud CDN
    short: CDN
    fidelity: close
    alternatives: [Media CDN]
    note: Cloud CDN is enabled on an external Application Load Balancer rather than deployed on its own.
    docs: https://cloud.google.com/cdn/docs
  waf:
    service: Google Cloud Armor
    short: ARM
    fidelity: exact
    docs: https://cloud.google.com/armor/docs
  load-balancer:
    service: Cloud Load Balancing (Application LB)
    short: LB
    fidelity: exact
    docs: https://cloud.google.com/load-balancing/docs
  api-gateway:
    service: API Gateway
    short: APIG
    fidelity: close
    alternatives: [Apigee]
    note: Lighter than Amazon API Gateway or Azure API Management; Apigee is the full-featured option.
    docs: https://cloud.google.com/api-gateway/docs
  container-service:
    service: Cloud Run
    short: RUN
    fidelity: exact
    alternatives: [GKE Autopilot]
    docs: https://cloud.google.com/run/docs
  serverless-function:
    service: Cloud Run functions
    short: FN
    fidelity: exact
    docs: https://cloud.google.com/functions/docs
  llm-inference:
    service: Vertex AI
    short: VAI
    fidelity: exact
    docs: https://cloud.google.com/vertex-ai/docs
  message-queue:
    service: Pub/Sub
    short: PS
    fidelity: close
    alternatives: [Cloud Tasks]
    note: Pub/Sub is publish/subscribe; a single subscription behaves like a queue. Cloud Tasks suits explicit task dispatch with rate limits.
    docs: https://cloud.google.com/pubsub/docs
  event-bus:
    service: Eventarc
    short: EA
    fidelity: close
    note: Routes events to Cloud Run, functions and Workflows; filtering is simpler than EventBridge rules.
    docs: https://cloud.google.com/eventarc/docs
  stream:
    service: Pub/Sub
    short: PS
    fidelity: close
    alternatives: [Google Cloud Managed Service for Apache Kafka]
    note: Supports ordering keys and replay by seeking, but is not a partitioned log like Kinesis or Kafka.
    docs: https://cloud.google.com/pubsub/docs
  workflow:
    service: Workflows
    short: WF
    fidelity: exact
    docs: https://cloud.google.com/workflows/docs
  batch-etl:
    service: Dataflow
    short: DF
    fidelity: close
    alternatives: [Dataproc Serverless, Cloud Data Fusion]
    note: Dataflow runs Apache Beam pipelines; Spark jobs fit Dataproc Serverless better.
    docs: https://cloud.google.com/dataflow/docs
  object-storage:
    service: Cloud Storage
    short: GCS
    fidelity: exact
    docs: https://cloud.google.com/storage/docs
  relational-db:
    service: Cloud SQL for PostgreSQL
    short: SQL
    fidelity: exact
    alternatives: [AlloyDB for PostgreSQL]
    docs: https://cloud.google.com/sql/docs/postgres
  key-value-db:
    service: Firestore
    short: FS
    fidelity: close
    alternatives: [Bigtable]
    note: A document database with a different query and pricing model from DynamoDB; Bigtable suits very high-throughput wide-column data.
    docs: https://cloud.google.com/firestore/docs
  cache:
    service: Memorystore (Redis / Valkey)
    short: MS
    fidelity: exact
    docs: https://cloud.google.com/memorystore/docs
  vector-search:
    service: Vertex AI Vector Search
    short: VS
    fidelity: exact
    alternatives: [AlloyDB or Cloud SQL with pgvector]
    docs: https://cloud.google.com/vertex-ai/docs/vector-search/overview
  data-warehouse:
    service: BigQuery
    short: BQ
    fidelity: exact
    docs: https://cloud.google.com/bigquery/docs
  identity:
    service: Identity Platform
    short: IDP
    fidelity: exact
    alternatives: [Firebase Authentication]
    docs: https://cloud.google.com/identity-platform/docs
  secrets:
    service: Secret Manager
    short: SM
    fidelity: exact
    docs: https://cloud.google.com/secret-manager/docs
  monitoring:
    service: Cloud Monitoring + Cloud Logging
    short: MON
    fidelity: exact
    docs: https://cloud.google.com/monitoring/docs
  kubernetes:
    service: Google Kubernetes Engine (GKE)
    short: GKE
    fidelity: exact
    alternatives: [GKE Autopilot]
    docs: https://cloud.google.com/kubernetes-engine/docs
  event-autoscaling:
    service: KEDA on GKE
    short: KEDA
    fidelity: close
    note: >-
      KEDA is an open-source add-on you install on GKE. Cloud Run already scales on
      requests and events without it.
    docs: https://keda.sh/docs/
  source-control:
    service: Secure Source Manager
    short: SSM
    fidelity: exact
    alternatives: [GitHub or GitLab via Developer Connect]
    docs: https://cloud.google.com/secure-source-manager/docs
  ci-build:
    service: Cloud Build
    short: CB
    fidelity: exact
    docs: https://cloud.google.com/build/docs
  container-registry:
    service: Artifact Registry
    short: AR
    fidelity: exact
    docs: https://cloud.google.com/artifact-registry/docs
  cd-deploy:
    service: Cloud Deploy
    short: CD
    fidelity: exact
    docs: https://cloud.google.com/deploy/docs
  iac:
    service: Infrastructure Manager (Terraform)
    short: IM
    fidelity: exact
    alternatives: [Terraform or OpenTofu]
    note: A managed service that runs Terraform configurations.
    docs: https://cloud.google.com/infrastructure-manager/docs
