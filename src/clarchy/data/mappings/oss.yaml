# Capability -> open-source software you run yourself. Same fields as aws.yaml.
# Fidelity here also reflects operational burden: "close" usually means you take on
# scaling, upgrades and availability that a managed service would handle.
# Licences change (e.g. Redis, MinIO, Vault, ScyllaDB moved away from OSI licences);
# choices below favour OSI-licensed projects. Not yet reviewed by a specialist.

provider:
  name: Open source
  cloud_label: Self-hosted (open source)
  kind: self-hosted
  reviewed: false
  # Neutral styling for self-hosted stacks: a dashed boundary because you run it all.
  theme:
    font: "'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif"
    frame: { stroke: "#334155", fill: "#FFFFFF", label: "#1E293B", dash: "7 5" }
    band: { stroke: "#94A3B8", label: "#475569" }
    edge: "#475569"
    categories:
      external: "#475569"
      networking: "#2563EB"
      security: "#B91C1C"
      compute: "#C2410C"
      containers: "#0E7490"
      ai: "#7C3AED"
      integration: "#BE185D"
      analytics: "#6D28D9"
      database: "#1D4ED8"
      storage: "#15803D"
      devtools: "#334155"
      management: "#4D7C0F"

services:
  dns:
    service: PowerDNS
    short: PDNS
    fidelity: partial
    alternatives: [BIND, CoreDNS (internal DNS), Cloudflare DNS]
    note: You run and protect authoritative DNS servers yourself; most teams keep a managed DNS provider.
    docs: https://doc.powerdns.com/
  cdn:
    service: Varnish Cache
    short: VAR
    fidelity: partial
    alternatives: [NGINX caching, Cloudflare]
    note: Caches at your own servers, not at a global edge network; a worldwide CDN is not practical to self-host.
    docs: https://varnish-cache.org/docs/
  waf:
    service: Coraza WAF + OWASP Core Rule Set
    short: CRZ
    icon: owasp
    fidelity: close
    alternatives: [ModSecurity, Cloudflare WAF]
    note: You own rule updates, tuning and false positives.
    docs: https://coraza.io/docs/
  load-balancer:
    service: HAProxy
    short: HAP
    fidelity: close
    alternatives: [NGINX, Envoy]
    note: Run at least two instances for availability and handle TLS certificates yourself.
    docs: https://docs.haproxy.org/
  api-gateway:
    service: Kong Gateway (OSS)
    short: KNG
    icon: kong
    fidelity: close
    alternatives: [Apache APISIX]
    note: Feature-rich, but you operate, scale and upgrade it.
    docs: https://developer.konghq.com/gateway/
  container-service:
    service: Kubernetes
    short: K8S
    icon: kubernetes
    fidelity: close
    alternatives: [K3s, HashiCorp Nomad]
    note: You manage the cluster, nodes and upgrades; there is no per-second serverless billing.
    docs: https://kubernetes.io/docs/
  serverless-function:
    service: Knative Serving
    short: KN
    icon: knative
    fidelity: close
    alternatives: [OpenFaaS]
    note: Scale-to-zero on your Kubernetes cluster; the cluster itself keeps running and costing money.
    docs: https://knative.dev/docs/
  llm-inference:
    service: vLLM (open-weight models)
    short: VLM
    icon: vllm
    fidelity: close
    alternatives: [Ollama, Hugging Face TGI, OpenAI API, Anthropic API (Claude), Hugging Face Inference Endpoints]
    note: Needs GPUs you provision; limited to open-weight models.
    docs: https://docs.vllm.ai/
  agent-orchestration:
    service: LangGraph
    short: LG
    icon: langgraph
    fidelity: exact
    alternatives: [CrewAI, LlamaIndex Workflows]
    note: A library that runs inside your own containers, with checkpoints in your database; LangGraph Platform is the hosted option.
    docs: https://github.com/langchain-ai/langgraph
  llm-gateway:
    service: LiteLLM Proxy
    short: LTL
    icon: litellm
    fidelity: exact
    alternatives: [Portkey Gateway, Kong AI Gateway]
    note: Self-hosted proxy with an OpenAI-compatible API for more than 100 model providers, virtual keys, budgets, fallbacks and caching.
    docs: https://docs.litellm.ai/
  llm-observability:
    service: Langfuse
    short: LF
    icon: langfuse
    fidelity: exact
    alternatives: [Arize Phoenix, OpenLLMetry]
    note: Self-hosting needs Postgres, ClickHouse, Redis and object storage; Langfuse Cloud is the hosted option.
    docs: https://langfuse.com/docs
  message-queue:
    service: RabbitMQ
    short: RMQ
    icon: rabbitmq
    fidelity: exact
    alternatives: [NATS JetStream]
    docs: https://www.rabbitmq.com/docs
  event-bus:
    service: Knative Eventing
    short: KNE
    icon: knative
    fidelity: partial
    alternatives: [NATS]
    note: Provides event routing on Kubernetes; rule-based routing across many sources needs more assembly than a managed event bus.
    docs: https://knative.dev/docs/eventing/
  stream:
    service: Apache Kafka
    short: KFK
    icon: apachekafka
    fidelity: exact
    alternatives: [Apache Pulsar]
    docs: https://kafka.apache.org/documentation/
  workflow:
    service: Temporal
    short: TMP
    icon: temporal
    fidelity: close
    alternatives: [Apache Airflow]
    note: Code-first durable workflows; Airflow suits scheduled data pipelines more than application workflows.
    docs: https://docs.temporal.io/
  batch-etl:
    service: Apache Spark
    short: SPK
    icon: apachespark
    fidelity: close
    alternatives: [Apache Airflow + dbt]
    note: You run the cluster and a scheduler; managed ETL services hide both.
    docs: https://spark.apache.org/docs/latest/
  object-storage:
    service: Ceph Object Gateway
    short: CEPH
    icon: ceph
    fidelity: close
    alternatives: [SeaweedFS, Garage, MinIO]
    note: S3-compatible API, but you operate durability, replication, capacity and upgrades.
    docs: https://docs.ceph.com/en/latest/radosgw/
  relational-db:
    service: PostgreSQL
    short: PG
    icon: postgresql
    fidelity: exact
    note: Backups, failover and upgrades are yours to run (tools such as Patroni help).
    docs: https://www.postgresql.org/docs/
  key-value-db:
    service: Apache Cassandra
    short: CAS
    icon: apachecassandra
    fidelity: close
    alternatives: [FerretDB]
    note: Scales well but needs careful data modelling and cluster operations.
    docs: https://cassandra.apache.org/doc/latest/
  cache:
    service: Valkey
    short: VK
    fidelity: exact
    alternatives: [Redis]
    docs: https://valkey.io/docs/
  vector-search:
    service: pgvector (PostgreSQL)
    short: PGV
    icon: postgresql
    fidelity: exact
    alternatives: [Qdrant, Milvus, OpenSearch]
    docs: https://github.com/pgvector/pgvector
  data-warehouse:
    service: ClickHouse
    short: CH
    icon: clickhouse
    fidelity: close
    alternatives: [Apache Doris, DuckDB]
    note: Very fast analytical queries, but you size and operate the cluster.
    docs: https://clickhouse.com/docs
  identity:
    service: Keycloak
    short: KC
    icon: keycloak
    fidelity: exact
    docs: https://www.keycloak.org/documentation
  secrets:
    service: OpenBao
    short: BAO
    icon: openbao
    fidelity: exact
    alternatives: [HashiCorp Vault]
    docs: https://openbao.org/docs/
  monitoring:
    service: Prometheus + Grafana
    short: PRO
    icon: prometheus
    fidelity: close
    alternatives: [OpenTelemetry Collector, Grafana Loki]
    note: You store and retain metrics and logs yourself.
    docs: https://prometheus.io/docs/
  kubernetes:
    service: Kubernetes
    short: K8S
    icon: kubernetes
    fidelity: exact
    alternatives: [K3s]
    note: You run the control plane, nodes and upgrades yourself.
    docs: https://kubernetes.io/docs/
  event-autoscaling:
    service: KEDA
    short: KEDA
    fidelity: exact
    docs: https://keda.sh/docs/
  source-control:
    service: GitLab Community Edition
    short: GL
    icon: gitlab
    fidelity: exact
    alternatives: [Forgejo, Gitea]
    note: You run, back up and upgrade the Git server yourself.
    docs: https://docs.gitlab.com/
  ci-build:
    service: Jenkins
    short: JNK
    icon: jenkins
    fidelity: exact
    alternatives: [Tekton, GitLab CI/CD, Woodpecker CI]
    note: Build agents and plugins are yours to operate.
    docs: https://www.jenkins.io/doc/
  container-registry:
    service: Harbor
    short: HBR
    icon: harbor
    fidelity: exact
    docs: https://goharbor.io/docs/
  cd-deploy:
    service: Argo CD
    short: ARGO
    icon: argo
    fidelity: exact
    alternatives: [Flux]
    note: GitOps deployment to Kubernetes from the Git repository.
    docs: https://argo-cd.readthedocs.io/
  iac:
    service: OpenTofu
    short: TOFU
    icon: opentofu
    fidelity: exact
    alternatives: [Pulumi, Crossplane]
    docs: https://opentofu.org/docs/
  dev-environment:
    service: Coder
    short: CDR
    icon: coder
    fidelity: exact
    alternatives: [Dev Containers, Eclipse Che]
    note: Self-hosted cloud development environments on your own Kubernetes or VMs.
    docs: https://coder.com/docs
  ai-coding-assistant:
    service: Continue with open-weight models
    short: CON
    fidelity: partial
    alternatives: [Tabby, Claude Code]
    note: Runs against your own model server; quality depends on the model you host.
    docs: https://docs.continue.dev/
  ai-guardrails:
    service: NeMo Guardrails + Llama Guard
    short: NG
    fidelity: close
    alternatives: [Guardrails AI, Microsoft Presidio (PII)]
    note: You host the safety model and tune the rules yourself.
    docs: https://docs.nvidia.com/nemo/guardrails/
  archive-storage:
    service: MinIO (lifecycle tiering)
    short: MIN
    icon: minio
    fidelity: partial
    alternatives: [Ceph cold pools, Tape libraries]
    note: Archival durability depends on the cold storage you provide.
    docs: https://min.io/docs/minio/linux/administration/object-management/object-lifecycle-management.html
  access-governance:
    service: Keycloak + Open Policy Agent
    short: OPA
    icon: keycloak
    fidelity: close
    alternatives: [Teleport, HashiCorp Boundary]
    note: Approvals and access reviews are processes you build around them.
    docs: https://www.openpolicyagent.org/docs/latest/
  key-management:
    service: OpenBao Transit
    short: OBT
    icon: openbao
    fidelity: close
    alternatives: [HashiCorp Vault Transit]
    note: Keys live in a cluster you run, unseal and back up yourself.
    docs: https://openbao.org/docs/secrets/transit/
  audit-logging:
    service: Wazuh
    short: WZ
    fidelity: close
    alternatives: [Falco, OpenSearch audit logs]
    note: You decide what to collect and protect the log store from tampering yourself.
    docs: https://documentation.wazuh.com/
  backup:
    service: Velero + pgBackRest
    short: VEL
    fidelity: close
    alternatives: [Restic]
    note: Velero backs up Kubernetes resources and volumes; pgBackRest handles Postgres point-in-time recovery.
    docs: https://velero.io/docs/
