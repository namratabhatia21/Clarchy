name: AI agent platform
summary: Tool-using AI agents behind a chat API, with an LLM gateway for model routing and budgets, retrieval over company documents, and tracing of every model call.
requirements:
  users: 5000
  peak_rps: 10
  data_gb: 100
  data_growth_gb_per_month: 5
  availability_target: "99.9"
  region: us-east
components:
  - id: users
    capability: client
    label: Employees (browser)
  - id: cdn
    capability: cdn
    label: Web front end
    sizing: { egress_gb_per_month: 30 }
  - id: lb
    capability: load-balancer
    label: HTTPS load balancer
  - id: app
    capability: container-service
    label: Chat API (streaming)
    rationale: Streams agent progress and answers over long-lived connections, which suits containers better than short-lived functions.
    sizing: { vcpu: 1, memory_gb: 2, tasks: 2 }
  - id: agent
    capability: agent-orchestration
    label: Agent runtime (LangGraph)
    rationale: Runs LangGraph agents that plan, call tools and checkpoint their state, so long tasks survive restarts and can pause for a human to approve.
    sizing: { requests_per_month: 150000 }
  - id: tools
    capability: serverless-function
    label: Tool functions
    rationale: Small functions the agent calls as tools, such as looking up a record or opening a ticket, each with least-privilege access to one system.
    sizing: { invocations_per_month: 400000, avg_duration_ms: 300, memory_mb: 512 }
  - id: gateway
    capability: llm-gateway
    label: LLM gateway (LiteLLM)
    rationale: One OpenAI-compatible API in front of every model, with per-team keys and budgets, fallbacks between providers and response caching.
    sizing: { vcpu: 0.5, memory_gb: 1, tasks: 2 }
  - id: llm
    capability: llm-inference
    label: Models + embeddings
    rationale: Managed models behind the gateway; a larger model plans and a smaller one handles routine steps, billed per token.
    sizing: { requests_per_month: 450000 }
  - id: docs
    capability: object-storage
    label: Source documents
    sizing: { storage_gb: 100 }
  - id: ingest
    capability: serverless-function
    label: Chunk + embed documents
    rationale: Runs only when documents change.
    sizing: { invocations_per_month: 50000, avg_duration_ms: 3000, memory_mb: 1024 }
  - id: vectors
    capability: vector-search
    label: Knowledge index
    rationale: Lets the agent ground its answers in company documents with hybrid keyword and vector search.
  - id: state
    capability: relational-db
    label: Agent state + history
    rationale: Postgres holds the agent checkpoints, chat history and the gateway's spend log in one managed database.
    sizing: { storage_gb: 50 }
  - id: auth
    capability: identity
    label: Single sign-on
    sizing: { monthly_active_users: 5000 }
  - id: secrets
    capability: secrets
    label: Model and tool credentials
  - id: traces
    capability: llm-observability
    label: LLM tracing (Langfuse)
    rationale: Traces every prompt, tool call, token and cost, and scores samples with evals, so regressions show up before users notice them.
    sizing: { requests_per_month: 150000 }
  - id: guardrails
    capability: ai-guardrails
    label: AI guardrails
    rationale: Screens prompts, tool results and answers for prompt injection, harmful content and personal data.
  - id: access
    capability: access-governance
    label: Cloud access governance
    rationale: Staff sign in to the cloud with the company directory; the cloud architects approve least-privilege roles, and access is reviewed every quarter.
  - id: audit
    capability: audit-logging
    label: Audit trail
    rationale: Records every console change, data access and model call in a log nobody can edit.
  - id: keys
    capability: key-management
    label: Encryption keys
    rationale: Customer-managed keys encrypt the database, documents and backups.
  - id: logs
    capability: monitoring
    label: Logs, metrics, alarms
    sizing: { log_ingest_gb_per_month: 20 }
  - id: repo
    capability: source-control
    label: App and infrastructure code
    rationale: Every change starts as a reviewed commit; the same repository holds the application, the agent graphs and the infrastructure code.
  - id: build
    capability: ci-build
    label: Build, test and evaluate
    rationale: Builds and tests each commit and runs the agent's evaluation set, then packages the services as container images and the functions as bundles.
  - id: registry
    capability: container-registry
    label: Container images
    rationale: Keeps versioned, scanned images so every environment runs exactly what was tested.
  - id: deploy
    capability: cd-deploy
    label: Release pipeline
    rationale: Promotes each build through test and production with approvals and rollback.
  - id: infra-code
    capability: iac
    label: Infrastructure as code
    rationale: Creates and updates the cloud resources from versioned templates, so every environment is reproducible.
edges:
  - { from: users, to: cdn, label: HTTPS }
  - { from: cdn, to: lb, label: /api/* }
  - { from: lb, to: app }
  - { from: app, to: agent, label: run }
  - { from: agent, to: gateway, label: prompt }
  - { from: gateway, to: llm, label: route }
  - { from: agent, to: vectors, label: retrieve }
  - { from: agent, to: tools, label: call tools }
  - { from: agent, to: state, label: checkpoint }
  - { from: docs, to: ingest, label: on upload }
  - { from: ingest, to: gateway, label: embed }
  - { from: ingest, to: vectors, label: index }
  - { from: app, to: auth, label: verify token }
  - { from: agent, to: secrets }
  - { from: agent, to: guardrails, label: screen }
  - { from: repo, to: build, label: push }
  - { from: build, to: registry, label: image }
  - { from: registry, to: deploy }
  - { from: deploy, to: infra-code, label: applies }
workflows:
  - id: request
    name: Serving a request
    kind: request
    steps:
    - text: 'Employees (browser) → Web front end: load the app through the CDN (HTTPS)'
      components: [users, cdn]
    - text: 'Web front end → HTTPS load balancer: forward API calls'
      components: [cdn, lb]
    - text: 'HTTPS load balancer → Chat API (streaming): run the business logic'
      components: [lb, app]
    - text: 'Chat API (streaming) → Agent runtime (LangGraph): hand the request to the agent'
      components: [app, agent]
    - text: 'Chat API (streaming) → Single sign-on: verify the user''s sign-in token'
      components: [app, auth]
    - text: 'Agent runtime (LangGraph) → LLM gateway (LiteLLM): send the prompt through the gateway'
      components: [agent, gateway]
    - text: 'Agent runtime (LangGraph) → Knowledge index: retrieve relevant passages'
      components: [agent, vectors]
    - text: 'Agent runtime (LangGraph) → Tool functions: call tools that look up or change data'
      components: [agent, tools]
    - text: 'Agent runtime (LangGraph) → Agent state + history: save the agent''s progress and the conversation'
      components: [agent, state]
    - text: 'Agent runtime (LangGraph) → Model and tool credentials: fetch credentials'
      components: [agent, secrets]
    - text: 'Agent runtime (LangGraph) → AI guardrails: screen the prompt and the answer'
      components: [agent, guardrails]
    - text: 'LLM gateway (LiteLLM) → Models + embeddings: call the chosen model, falling back to another if it fails'
      components: [gateway, llm]
    - text: 'Every model call → LLM tracing (Langfuse): record the prompt, tool calls, tokens and cost'
      components: [traces, agent, gateway]
    - text: 'Every component → Logs, metrics, alarms: send logs and metrics'
      components: [logs]
  - id: background
    name: Background processing
    kind: async
    steps:
    - text: 'Source documents → Chunk + embed documents: start when a document is uploaded'
      components: [docs, ingest]
    - text: 'Chunk + embed documents → LLM gateway (LiteLLM): create embeddings'
      components: [ingest, gateway]
    - text: 'Chunk + embed documents → Knowledge index: index the new chunks'
      components: [ingest, vectors]
  - id: delivery
    name: Shipping a change
    kind: delivery
    steps:
    - text: 'A developer → App and infrastructure code: push a reviewed change'
      components: [repo]
    - text: 'App and infrastructure code → Build, test and evaluate: start a build on every push'
      components: [repo, build]
    - text: 'Build, test and evaluate → Container images: publish the tested image'
      components: [build, registry]
    - text: 'Container images → Release pipeline: start the release'
      components: [registry, deploy]
    - text: 'Release pipeline → Infrastructure as code: apply infrastructure changes'
      components: [deploy, infra-code]
    - text: 'Release pipeline → Chat API (streaming), Agent runtime (LangGraph), Tool functions, LLM gateway (LiteLLM), Chunk + embed documents: roll out the new version'
      components: [deploy, app, agent, tools, gateway, ingest]
