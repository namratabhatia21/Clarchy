name: Event-driven processing
summary: Uploads and events trigger asynchronous processing through a queue and a workflow, so slow jobs never block users.
requirements:
  users: 5000
  peak_rps: 20
  data_gb: 500
  data_growth_gb_per_month: 60
  availability_target: "99.9"
  region: india-mumbai
components:
  - id: producers
    capability: client
    label: Apps and partners
  - id: api
    capability: api-gateway
    label: Ingest API
    sizing: { requests_per_month: 2000000 }
  - id: ingest
    capability: serverless-function
    label: Validate + enqueue
    rationale: Short validation work per request; returns immediately and lets the queue absorb bursts.
    sizing: { invocations_per_month: 2000000, avg_duration_ms: 80, memory_mb: 256 }
  - id: queue
    capability: message-queue
    label: Job queue
    rationale: Buffers bursts, retries failures and sends poison messages to a dead-letter queue.
    sizing: { requests_per_month: 6000000 }
  - id: events
    capability: event-bus
    label: Domain events
    rationale: Lets new consumers subscribe later without changing producers.
    sizing: { events_per_month: 2000000 }
  - id: workflow
    capability: workflow
    label: Processing steps
    rationale: Multi-step jobs with retries and visible state instead of hand-written orchestration.
    sizing: { state_transitions_per_month: 10000000 }
  - id: workers
    capability: serverless-function
    label: Workers
    sizing: { invocations_per_month: 8000000, avg_duration_ms: 900, memory_mb: 1024 }
  - id: raw
    capability: object-storage
    label: Raw + processed files
    sizing: { storage_gb: 500, put_requests_per_month: 2000000 }
  - id: state
    capability: key-value-db
    label: Job status
    sizing: { storage_gb: 5, reads_per_month: 10000000, writes_per_month: 6000000 }
  - id: logs
    capability: monitoring
    label: Logs, metrics, alarms
    sizing: { log_ingest_gb_per_month: 20 }
  - id: repo
    capability: source-control
    label: App and infrastructure code
    rationale: Every change starts as a reviewed commit; the same repository holds the application and its
      infrastructure code.
  - id: build
    capability: ci-build
    label: Build and test
    rationale: Builds and tests each commit, then packages the functions.
  - id: deploy
    capability: cd-deploy
    label: Release pipeline
    rationale: Promotes each build through test and production with approvals and rollback.
  - id: infra-code
    capability: iac
    label: Infrastructure as code
    rationale: Creates and updates the cloud resources from versioned templates, so every environment is reproducible.
edges:
  - { from: producers, to: api }
  - { from: api, to: ingest }
  - { from: ingest, to: raw, label: store }
  - { from: ingest, to: queue }
  - { from: queue, to: workflow }
  - { from: workflow, to: workers }
  - { from: workers, to: raw }
  - { from: workers, to: state }
  - { from: workers, to: events, label: job done }
  - { from: repo, to: build, label: push }
  - { from: build, to: deploy, label: artifact }
  - { from: deploy, to: infra-code, label: applies }
workflows:
  - id: request
    name: Serving a request
    kind: request
    steps:
    - text: 'Apps and partners → Ingest API: authenticate, throttle and route the call'
      components: [producers, api]
    - text: 'Ingest API → Validate + enqueue: run the function'
      components: [api, ingest]
    - text: 'Validate + enqueue → Raw + processed files: store the upload'
      components: [ingest, raw]
    - text: 'Validate + enqueue → Job queue: queue the job'
      components: [ingest, queue]
    - text: 'Every component → Logs, metrics, alarms: send logs and metrics'
      components: [logs]
  - id: background
    name: Background processing
    kind: async
    steps:
    - text: 'Job queue → Processing steps: process the queued jobs'
      components: [queue, workflow]
    - text: 'Processing steps → Workers: run the function'
      components: [workflow, workers]
    - text: 'Workers → Raw + processed files: store or read files'
      components: [workers, raw]
    - text: 'Workers → Job status: read and write items'
      components: [workers, state]
    - text: 'Workers → Domain events: announce that the job is done'
      components: [workers, events]
  - id: delivery
    name: Shipping a change
    kind: delivery
    steps:
    - text: 'A developer → App and infrastructure code: push a reviewed change'
      components: [repo]
    - text: 'App and infrastructure code → Build and test: start a build on every push'
      components: [repo, build]
    - text: 'Build and test → Release pipeline: hand over the tested package'
      components: [build, deploy]
    - text: 'Release pipeline → Infrastructure as code: apply infrastructure changes'
      components: [deploy, infra-code]
    - text: 'Release pipeline → Validate + enqueue, Workers: roll out the new version'
      components: [deploy, ingest, workers]
