# How each capability is billed on each provider.
#
# Each item multiplies a usage quantity (worked out from the design's sizing and
# requirements in pricing.py; the key in `quantity`) by a price from the provider's price
# book (`price`; {placeholders} pick a size class). `scale` converts the quantity (for
# example 4 DPUs per ETL hour), `free` is an always-free monthly allowance in quantity
# units. Capabilities listed under `included` cost nothing extra (the note says why);
# anything missing is reported as "not priced".
aws:
  commitments:
    Compute Savings Plans: 1- or 3-year commitment to an hourly compute spend, no upfront payment; covers Fargate, Lambda and EC2 nodes.
    RDS reserved instances: 1 year no upfront, or 3 years partial upfront with the upfront fee spread over the term.
    ElastiCache reserved nodes: 1 or 3 years, no upfront payment.
    Redshift Serverless reservations: 1 year, no upfront; renewed each year in the 3-year view.
  included:
    source-control: Repository hosting (GitHub, GitLab) depends on your plan; AWS CodeConnections itself is free.
    iac: CloudFormation is free for AWS resources.
    access-governance: IAM, IAM Identity Center and AWS Organizations have no charge.
    event-autoscaling: KEDA is open source and runs on the cluster's nodes.
  capabilities:
    dns:
      pricing_url: https://aws.amazon.com/route53/pricing/
      items:
        - {name: Hosted zone, quantity: zones, price: route53.zones}
        - {name: DNS queries, quantity: dns_queries_m, price: route53.queries}
    cdn:
      pricing_url: https://aws.amazon.com/cloudfront/pricing/
      items:
        - {name: Data transfer out, quantity: egress_gb, price: cloudfront.egress_gb}
        - {name: HTTPS requests, quantity: cdn_requests_10k, price: cloudfront.requests}
    waf:
      pricing_url: https://aws.amazon.com/waf/pricing/
      items:
        - {name: Web ACL, quantity: waf_acls, price: waf.acls}
        - {name: Rules and managed rule groups, quantity: waf_rules, price: waf.rules}
        - {name: Requests inspected, quantity: waf_requests_m, price: waf.requests}
    load-balancer:
      pricing_url: https://aws.amazon.com/elasticloadbalancing/pricing/
      items:
        - {name: Load balancer hours, quantity: lb_hours, price: alb.hours}
        - {name: Capacity units, quantity: lcu_hours, price: alb.lcu_hours}
    api-gateway:
      pricing_url: https://aws.amazon.com/api-gateway/pricing/
      items:
        - {name: REST API requests, quantity: api_requests_m, price: apigw.requests}
    container-service:
      pricing_url: https://aws.amazon.com/fargate/pricing/
      commitment: Compute Savings Plans
      items:
        - {name: vCPU, quantity: vcpu_hours, price: fargate.vcpu_hours}
        - {name: Memory, quantity: gb_hours, price: fargate.gb_hours}
    kubernetes:
      pricing_url: https://aws.amazon.com/eks/pricing/
      commitment: Compute Savings Plans
      items:
        - {name: EKS cluster, quantity: cluster_hours, price: eks.cluster_hours}
        - {name: Worker nodes (m7g.large), quantity: node_hours, price: ec2.node_hours}
    serverless-function:
      pricing_url: https://aws.amazon.com/lambda/pricing/
      commitment: Compute Savings Plans
      items:
        - {name: Requests, quantity: requests_m, price: lambda.requests, free: 1}
        - {name: Compute, quantity: gb_seconds, price: lambda.gb_seconds, free: 400000}
    llm-inference:
      pricing_url: https://aws.amazon.com/bedrock/pricing/
      items:
        - {name: Input tokens (Amazon Nova Lite), quantity: input_tokens_m, price: bedrock.input_tokens}
        - {name: Output tokens (Amazon Nova Lite), quantity: output_tokens_m, price: bedrock.output_tokens}
        - {name: Embeddings (Titan Text Embeddings V2), quantity: embedding_tokens_m, price: bedrock.embedding_tokens}
    ai-guardrails:
      pricing_url: https://aws.amazon.com/bedrock/pricing/
      items:
        - {name: Content and prompt-attack filters, quantity: guard_units_k, price: guardrails.content_units}
        - {name: Personal data masking, quantity: guard_units_k, price: guardrails.pii_units}
    archive-storage:
      pricing_url: https://aws.amazon.com/s3/pricing/
      items:
        - {name: Archived data, quantity: archive_gb, price: glacier.deep_archive_gb}
    backup:
      pricing_url: https://aws.amazon.com/backup/pricing/
      items:
        - {name: Backup storage, quantity: backup_gb, price: "backup.{backup_kind}"}
    key-management:
      pricing_url: https://aws.amazon.com/kms/pricing/
      items:
        - {name: Customer managed keys, quantity: kms_keys, price: kms.keys}
        - {name: Key requests, quantity: kms_requests_10k, price: kms.requests, free: 2}
    audit-logging:
