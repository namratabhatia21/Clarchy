# Neutral region key -> each cloud provider's nearest region.
# Self-hosted (open-source) providers have no regions.
us-east:
  label: US East
  aws: { code: us-east-1, location: N. Virginia }
  gcp: { code: us-east4, location: N. Virginia }
  azure: { code: eastus, location: Virginia }
us-west:
  label: US West
  aws: { code: us-west-2, location: Oregon }
  gcp: { code: us-west1, location: Oregon }
  azure: { code: westus2, location: Washington }
eu-west:
  label: Western Europe
  aws: { code: eu-west-1, location: Ireland }
  gcp: { code: europe-west1, location: Belgium }
  azure: { code: northeurope, location: Ireland }
eu-central:
  label: Central Europe
  aws: { code: eu-central-1, location: Frankfurt }
  gcp: { code: europe-west3, location: Frankfurt }
  azure: { code: germanywestcentral, location: Frankfurt }
uk:
  label: United Kingdom
  aws: { code: eu-west-2, location: London }
  gcp: { code: europe-west2, location: London }
  azure: { code: uksouth, location: London }
india-mumbai:
  label: India (West)
  aws: { code: ap-south-1, location: Mumbai }
  gcp: { code: asia-south1, location: Mumbai }
  azure: { code: centralindia, location: Pune }
singapore:
  label: Singapore
  aws: { code: ap-southeast-1, location: Singapore }
  gcp: { code: asia-southeast1, location: Singapore }
  azure: { code: southeastasia, location: Singapore }
sydney:
  label: Australia (East)
  aws: { code: ap-southeast-2, location: Sydney }
  gcp: { code: australia-southeast1, location: Sydney }
  azure: { code: australiaeast, location: New South Wales }
