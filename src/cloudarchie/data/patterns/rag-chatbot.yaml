name: RAG chatbot
summary: Chat assistant that answers from your own documents using retrieval-augmented generation with a managed LLM.
requirements:
  users: 2000
  peak_rps: 5
  data_gb: 50
  data_growth_gb_per_month: 5
  availability_target: "99.9"
  region: us-west
components:
  - id: users
    capability: client
    label: Employees (browser)
  - id: cdn
    capability: cdn
    label: Web front end
    sizing: { egress_gb_per_month: 20 }
  - id: lb
    capability: load-balancer
    label: HTTPS load balancer
  - id: app
    capability: container-service
    label: Chat API (streaming)
    rationale: Streaming responses hold connections for many seconds, which suits containers better than short-lived functions.
    sizing: { vcpu: 1, memory_gb: 2, tasks: 2, hours_per_month: 730 }
  - id: llm
    capability: llm-inference
    label: LLM + embeddings
    rationale: Managed models avoid hosting GPUs; pay per token.
    sizing: { input_tokens_per_month: 60000000, output_tokens_per_month: 8000000, embedding_tokens_per_month: 20000000 }
  - id: ingest
    capability: serverless-function
    label: Chunk + embed documents
    rationale: Runs only when documents change.
    sizing: { invocations_per_month: 50000, avg_duration_ms: 3000, memory_mb: 1024 }
  - id: docs
    capability: object-storage
    label: Source documents
    sizing: { storage_gb: 50 }
  - id: vectors
    capability: vector-search
    label: Embeddings index
    rationale: Similarity search over document chunks; hybrid keyword + vector improves recall.
    sizing: { vectors: 2000000, dimensions: 1024 }
  - id: history
    capability: key-value-db
    label: Chat history
    sizing: { storage_gb: 10, reads_per_month: 2000000, writes_per_month: 1000000 }
  - id: auth
    capability: identity
    label: Single sign-on
    sizing: { monthly_active_users: 2000 }
  - id: logs
    capability: monitoring
    label: Logs, traces, cost alarms
    sizing: { log_ingest_gb_per_month: 15 }
  - id: repo
    capability: source-control
    label: App and infrastructure code
    rationale: Every change starts as a reviewed commit; the same repository holds the application and its
      infrastructure code.
  - id: build
    capability: ci-build
    label: Build and test
    rationale: Builds and tests each commit, then packages the services as container images and the functions
      as bundles.
  - id: registry
    capability: container-registry
    label: Container images
    rationale: Keeps versioned, scanned images so every environment runs exactly what was tested.
  - id: deploy
    capability: cd-deploy
    label: Release pipeline
    rationale: Promotes each build through test and production with approvals and rollback.
  - id: infra-code
    capability: iac
    label: Infrastructure as code
    rationale: Creates and updates the cloud resources from versioned templates, so every environment is reproducible.
edges:
  - { from: users, to: cdn, label: HTTPS }
  - { from: cdn, to: lb, label: /api/* }
  - { from: lb, to: app }
  - { from: app, to: vectors, label: retrieve }
  - { from: app, to: llm, label: generate }
  - { from: app, to: history }
  - { from: docs, to: ingest, label: on upload }
  - { from: ingest, to: llm, label: embed }
  - { from: ingest, to: vectors, label: index }
  - { from: app, to: auth, label: verify token }
  - { from: repo, to: build, label: push }
  - { from: build, to: registry, label: image }
  - { from: registry, to: deploy }
  - { from: deploy, to: infra-code, label: applies }
workflows:
  - id: request
    name: Serving a request
    kind: request
    steps:
    - text: 'Employees (browser) → Web front end: load the app through the CDN (HTTPS)'
      components: [users, cdn]
    - text: 'Web front end → HTTPS load balancer: forward API calls'
      components: [cdn, lb]
    - text: 'HTTPS load balancer → Chat API (streaming): run the business logic'
      components: [lb, app]
    - text: 'Chat API (streaming) → Embeddings index: retrieve relevant passages'
      components: [app, vectors]
    - text: 'Chat API (streaming) → LLM + embeddings: generate the answer'
      components: [app, llm]
    - text: 'Chat API (streaming) → Chat history: read and write items'
      components: [app, history]
    - text: 'Chat API (streaming) → Single sign-on: verify the user''s sign-in token'
      components: [app, auth]
    - text: 'Every component → Logs, traces, cost alarms: send logs and metrics'
      components: [logs]
  - id: background
    name: Background processing
    kind: async
    steps:
    - text: 'Source documents → Chunk + embed documents: start when a document is uploaded'
      components: [docs, ingest]
    - text: 'Chunk + embed documents → LLM + embeddings: create embeddings'
      components: [ingest, llm]
    - text: 'Chunk + embed documents → Embeddings index: index the new chunks'
      components: [ingest, vectors]
  - id: delivery
    name: Shipping a change
    kind: delivery
    steps:
    - text: 'A developer → App and infrastructure code: push a reviewed change'
      components: [repo]
    - text: 'App and infrastructure code → Build and test: start a build on every push'
      components: [repo, build]
    - text: 'Build and test → Container images: publish the tested image'
      components: [build, registry]
    - text: 'Container images → Release pipeline: start the release'
      components: [registry, deploy]
    - text: 'Release pipeline → Infrastructure as code: apply infrastructure changes'
      components: [deploy, infra-code]
    - text: 'Release pipeline → Chat API (streaming), Chunk + embed documents: roll out the new version'
      components: [deploy, app, ingest]
